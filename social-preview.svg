<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Hussam Faroug social preview</title>
  <desc id="desc">A minimal social preview for hussamfaroug.com with a monogram and URL.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#ececee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g transform="translate(640 255)">
    <rect x="-120" y="-120" width="240" height="240" rx="52" fill="#111111"/>
    <text x="0" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700" fill="#ffffff" letter-spacing="-10">HF</text>
  </g>

  <text x="640" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#1b1b1b" letter-spacing="1.4">hussamfaroug.com</text>

  <line x1="420" y1="485" x2="860" y2="485" stroke="#d2d2d5" stroke-width="2"/>
</svg>
