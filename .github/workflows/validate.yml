name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          npm install
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run build
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          validate_site() {
            local root="$1"
            test -f "$root/index.html"
            test -f "$root/Privacy.html"
            test -f "$root/style.css"
            test -f "$root/HF.svg"
            test -f "$root/Background.jpeg"
            test -f "$root/social-preview.svg"
            test -f "$root/sitemap.xml"
            test -f "$root/robots.txt"
            test -f "$root/llms.txt"
            test -f "$root/.well-known/agent-card.json"
            test -f "$root/.well-known/api-catalog"
            grep -q 'href="/style.css"' "$root/index.html"
            grep -q 'href="/HF.svg"' "$root/index.html"
            grep -q 'url("/Background.jpeg")' "$root/style.css"
            grep -q 'https://hussamfaroug.com/social-preview.svg' "$root/index.html"
            grep -q 'https://hussamfaroug.com/Privacy.html' "$root/sitemap.xml"
            grep -q 'https://hussamfaroug.com/Privacy.html' "$root/llms.txt"
            ! grep -R 'social-preview.png\|https://hussamfaroug.com/Privacy[^.]' --include='*.html' --include='*.xml' --include='*.txt' "$root"
          }

          for root in . dist; do
            validate_site "$root"
          done
          cmp Background.jpeg dist/Background.jpeg
          node -e "const fs=require('node:fs'); for (const root of ['.', 'dist']) { JSON.parse(fs.readFileSync(\`\${root}/.well-known/agent-card.json\`, 'utf8')); JSON.parse(fs.readFileSync(\`\${root}/.well-known/api-catalog\`, 'utf8')); }"
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          for root in . dist; do
            xmllint --noout "$root/sitemap.xml"
            xmllint --noout "$root/HF.svg"
            xmllint --noout "$root/social-preview.svg"
            xmllint --noout "$root/.well-known/bimi/logo.svg"
          done
      - name: Validate MTA-STS policy syntax
        shell: bash
        run: |
          set -euo pipefail
          for root in . dist; do
            file="$root/.well-known/mta-sts.txt"
            grep -q '^version: STSv1$' "$file"
            grep -q '^mode: testing$' "$file"
            test "$(grep -c '^mx: ' "$file")" -eq 2
          done
