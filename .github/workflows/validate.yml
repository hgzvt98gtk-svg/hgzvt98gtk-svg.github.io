name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install xmllint when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libxml2-utils || {
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libxml2-utils
            }
          fi
      - name: Install Node dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: npm ci
          npm ci
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:site
          cmp Background.jpeg dist/Background.jpeg
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          for root in . dist; do
            xmllint --noout "$root/sitemap.xml"
            xmllint --noout "$root/HF.svg"
            xmllint --noout "$root/social-preview.svg"
            xmllint --noout "$root/.well-known/bimi/logo.svg"
          done
