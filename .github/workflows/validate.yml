name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install xmllint when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libxml2-utils || {
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libxml2-utils
            }
          fi
      - name: Install Node dependencies
        shell: bash
        run: npm ci --prefer-offline --no-audit
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files, XML/SVG, and module dependencies in parallel
        shell: bash
        run: |
          set -euo pipefail

          log_dir="$(mktemp -d)"

          run_validation() {
            local name="$1"
            shift
            (
              set +e
              "$@" >"${log_dir}/${name}.log" 2>&1
              printf '%s\n' "$?" >"${log_dir}/${name}.status"
            ) &
          }

          validation_status() {
            local name="$1"
            if [ ! -f "${log_dir}/${name}.status" ]; then
              printf '1\n'
              return
            fi
            cat "${log_dir}/${name}.status"
          }
          run_validation site npm run validate:site
          run_validation xml npm run validate:xml
          run_validation deps npm run validate:deps
          wait || true

          failures=0
          failed_jobs=()

          if [ "$(validation_status site)" -ne 0 ]; then
            failures=$((failures + 1))
            failed_jobs+=("site")
          fi
          if [ "$(validation_status xml)" -ne 0 ]; then
            failures=$((failures + 1))
            failed_jobs+=("xml")
          fi
          if [ "$(validation_status deps)" -ne 0 ]; then
            failures=$((failures + 1))
            failed_jobs+=("deps")
          fi

          cmp Background.jpeg dist/Background.jpeg || {
            failures=$((failures + 1))
            failed_jobs+=("cmp")
          }

          for job in "${failed_jobs[@]}"; do
            if [ "$job" = "cmp" ]; then
              echo "::error::Background.jpeg and dist/Background.jpeg differ."
              continue
            fi
            echo "::group::Failed validation output (${job})"
            cat "${log_dir}/${job}.log"
            echo "::endgroup::"
          done

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
