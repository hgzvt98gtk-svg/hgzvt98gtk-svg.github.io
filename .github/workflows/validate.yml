name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f Privacy.html
          test -f style.css
          test -f site.js
          test -f HF.svg
          test -f Background.jpeg
          test -f social-preview.svg
          test -f sitemap.xml
          test -f robots.txt
          test -f llms.txt
          grep -q 'href="/style.css"' index.html
          grep -q 'href="/HF.svg"' index.html
          grep -q '<script type="module" src="/site.js"></script>' index.html
          grep -q 'url("/Background.jpeg")' style.css
          grep -q 'https://hussamfaroug.com/social-preview.svg' index.html
          grep -q 'https://hussamfaroug.com/Privacy.html' sitemap.xml
          grep -q 'https://hussamfaroug.com/Privacy.html' llms.txt
          ! grep -R 'social-preview.png\|https://hussamfaroug.com/Privacy[^.]' --include='*.html' --include='*.xml' --include='*.txt' .
      - name: Validate security baseline
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "HF2026SecureNonce\\|'unsafe-inline'\\|'unsafe-eval'" index.html site.js _headers
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          violations = []

          class ScriptTagChecker(HTMLParser):
              def __init__(self, file_name):
                  super().__init__()
                  self.file_name = file_name

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attributes = {k.lower(): (v or "").lower() for k, v in attrs}
                  if "src" in attributes:
                      return
                  script_type = attributes.get("type", "").strip()
                  if script_type in ("application/ld+json", "application/json"):
                      return
                  violations.append(f"{self.file_name}:{self.getpos()[0]}: executable inline <script> is not allowed")

          for html_path in Path(".").glob("*.html"):
              checker = ScriptTagChecker(str(html_path))
              checker.feed(html_path.read_text(encoding="utf-8"))

          if violations:
              print("\n".join(violations))
              sys.exit(1)
          PY
          ! grep -R 'http://' --include='*.html' --include='*.txt' --include='*.css' .
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout sitemap.xml
          xmllint --noout HF.svg
          xmllint --noout social-preview.svg
          xmllint --noout .well-known/bimi/logo.svg
      - name: Validate MTA-STS policy syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: STSv1$' .well-known/mta-sts.txt
          grep -q '^mode: testing$' .well-known/mta-sts.txt
          test "$(grep -c '^mx: ' .well-known/mta-sts.txt)" -eq 2
