name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          npm ci
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:site
          cmp Background.jpeg dist/Background.jpeg
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          for root in . dist; do
            xmllint --noout "$root/sitemap.xml"
            xmllint --noout "$root/HF.svg"
            xmllint --noout "$root/social-preview.svg"
            xmllint --noout "$root/.well-known/bimi/logo.svg"
          done
      - name: Validate MTA-STS policy syntax
        shell: bash
        run: |
          set -euo pipefail
          for root in . dist; do
            file="$root/.well-known/mta-sts.txt"
            grep -q '^version: STSv1$' "$file"
            grep -q '^mode: testing$' "$file"
            test "$(grep -c '^mx: ' "$file")" -eq 2
          done
