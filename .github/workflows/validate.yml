name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libxml2-utils || {
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libxml2-utils
            }
          fi
          npm ci --prefer-offline --no-audit
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:site
          cmp Background.jpeg dist/Background.jpeg
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:xml
