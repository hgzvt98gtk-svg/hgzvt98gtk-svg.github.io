name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f Privacy.html
          test -f style.css
          test -f HF.svg
          test -f Background.jpeg
          test -f social-preview.svg
          test -f sitemap.xml
          test -f robots.txt
          test -f llms.txt
          grep -q 'href="/style.css"' index.html
          grep -q 'href="/HF.svg"' index.html
          grep -q 'url("/Background.jpeg")' style.css
          grep -q 'https://hussamfaroug.com/social-preview.svg' index.html
          grep -q 'https://hussamfaroug.com/Privacy.html' sitemap.xml
          grep -q 'https://hussamfaroug.com/Privacy.html' llms.txt
          ! grep -R 'social-preview.png\|https://hussamfaroug.com/Privacy[^.]' --include='*.html' --include='*.xml' --include='*.txt' .
      - name: Validate security header configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f _headers
          ! grep -q 'nonce-' _headers
          ! grep -q 'Cross-Origin-Embedder-Policy:' _headers
          ! grep -q 'Cross-Origin-Opener-Policy:' _headers
          ! grep -q '/auth.md' _headers
          ! grep -q 'challenges.cloudflare.com' _headers
          python <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          index = Path("index.html").read_text()
          headers = Path("_headers").read_text()

          scripts = []
          for match in re.finditer(r"<script\b(?P<attrs>[^>]*)>(?P<body>.*?)</script>", index, re.S | re.I):
              attrs = match.group("attrs")
              if re.search(r"\bsrc\s*=", attrs, re.I):
                  continue
              if not re.search(r"\btype\s*=\s*(['\"])module\1", attrs, re.I):
                  continue
              if re.search(r"\bnonce\s*=", attrs, re.I):
                  raise SystemExit("index.html should not rely on a static CSP nonce")
              scripts.append(match.group("body"))

          if len(scripts) != 1:
              raise SystemExit("expected exactly one inline module script")

          digest = base64.b64encode(hashlib.sha256(scripts[0].encode()).digest()).decode()
          expected = f\"'sha256-{digest}'\"
          if expected not in headers:
              raise SystemExit(f\"_headers is missing {expected}\")
          PY
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout sitemap.xml
          xmllint --noout HF.svg
          xmllint --noout social-preview.svg
          xmllint --noout .well-known/bimi/logo.svg
      - name: Validate MTA-STS policy syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: STSv1$' .well-known/mta-sts.txt
          grep -q '^mode: testing$' .well-known/mta-sts.txt
          test "$(grep -c '^mx: ' .well-known/mta-sts.txt)" -eq 2
