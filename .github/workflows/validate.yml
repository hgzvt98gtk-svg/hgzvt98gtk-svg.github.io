name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm ci
      - name: Install XML lint tool
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f Privacy.html
          test -f style.css
          test -f HF.svg
          test -f Background.jpeg
          test -f social-preview.svg
          test -f sitemap.xml
          test -f robots.txt
          test -f llms.txt
          grep -q 'href="/style.css"' index.html
          grep -q 'href="/HF.svg"' index.html
          grep -Eq '<script[^>]*type[[:space:]]*=[[:space:]]*"module"[^>]*src[[:space:]]*=[[:space:]]*"(\./|/)?model-context\.js"|<script[^>]*src[[:space:]]*=[[:space:]]*"(\./|/)?model-context\.js"[^>]*type[[:space:]]*=[[:space:]]*"module"' index.html
          ! grep -q 'nonce=' index.html
          ! (grep '<script' ./*.html | grep -v 'src=')
          grep -q 'url("/Background.jpeg")' style.css
          grep -q 'https://hussamfaroug.com/social-preview.svg' index.html
          grep -q 'https://hussamfaroug.com/Privacy.html' sitemap.xml
          grep -q 'https://hussamfaroug.com/Privacy.html' llms.txt
          ! grep -q '^/auth.md$' _headers
          ! grep -q 'nonce-' _headers
          ! grep -R 'social-preview.png\|https://hussamfaroug.com/Privacy[^.]' --include='*.html' --include='*.xml' --include='*.txt' .
      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/CNAME
          test -f dist/model-context.js
          test -f dist/.well-known/mta-sts.txt
          test -f dist/.well-known/bimi/logo.svg
          test -f dist/Background.jpeg
          grep -qx 'hussamfaroug.com' dist/CNAME
          cmp CNAME dist/CNAME
          cmp Background.jpeg dist/Background.jpeg
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout sitemap.xml
          xmllint --noout HF.svg
          xmllint --noout social-preview.svg
          xmllint --noout .well-known/bimi/logo.svg
      - name: Validate MTA-STS policy syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: STSv1$' .well-known/mta-sts.txt
          grep -q '^mode: testing$' .well-known/mta-sts.txt
          test "$(grep -c '^mx: ' .well-known/mta-sts.txt)" -eq 2
