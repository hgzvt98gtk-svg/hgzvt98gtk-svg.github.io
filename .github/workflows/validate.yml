name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libxml2-utils
          fi
          npm ci --prefer-offline --no-audit
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files, XML/SVG, and dependency graph in parallel
        shell: bash
        run: |
          set -euo pipefail

          npm run validate:site &
          site_pid=$!

          npm run validate:xml &
          xml_pid=$!

          npm run validate:deps &
          deps_pid=$!

          status=0
          wait "$site_pid" || status=1
          wait "$xml_pid" || status=1
          wait "$deps_pid" || status=1

          cmp Background.jpeg dist/Background.jpeg

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
