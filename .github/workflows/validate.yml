name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          npm install
      - name: Generate checked-in site files
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          git diff --exit-code
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run build
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:site
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          for root in . dist; do
            xmllint --noout "$root/sitemap.xml"
            xmllint --noout "$root/HF.svg"
            xmllint --noout "$root/social-preview.svg"
            xmllint --noout "$root/.well-known/bimi/logo.svg"
          done
