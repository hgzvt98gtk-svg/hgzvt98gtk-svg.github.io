name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          npm install
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run build
      - name: Validate local files and cross-references
        shell: bash
        run: |
          set -euo pipefail
          validate_site() {
            local root="$1"
            test -f "$root/index.html"
            test -f "$root/Privacy.html"
            test -f "$root/style.css"
            test -f "$root/HF.svg"
            test -f "$root/Background.jpeg"
            test -f "$root/social-preview.svg"
            test -f "$root/sitemap.xml"
            test -f "$root/robots.txt"
            test -f "$root/llms.txt"
            test -f "$root/.well-known/agent-card.json"
            test -f "$root/.well-known/api-catalog"
            grep -q 'href="/style.css"' "$root/index.html"
            grep -q 'href="/HF.svg"' "$root/index.html"
            grep -q 'url("/Background.jpeg")' "$root/style.css"
            grep -q 'https://hussamfaroug.com/social-preview.svg' "$root/index.html"
            grep -q 'https://hussamfaroug.com/Privacy.html' "$root/sitemap.xml"
            grep -q 'https://hussamfaroug.com/Privacy.html' "$root/llms.txt"
            ! grep -R 'social-preview.png\|https://hussamfaroug.com/Privacy[^.]' --include='*.html' --include='*.xml' --include='*.txt' "$root"
          }

          validate_site .
          validate_site dist
          cmp Background.jpeg dist/Background.jpeg
          node -e "JSON.parse(require('node:fs').readFileSync('.well-known/agent-card.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('.well-known/api-catalog', 'utf8')); JSON.parse(require('node:fs').readFileSync('dist/.well-known/agent-card.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('dist/.well-known/api-catalog', 'utf8'));"
      - name: Validate XML and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout sitemap.xml
          xmllint --noout HF.svg
          xmllint --noout social-preview.svg
          xmllint --noout .well-known/bimi/logo.svg
          xmllint --noout dist/sitemap.xml
          xmllint --noout dist/HF.svg
          xmllint --noout dist/social-preview.svg
          xmllint --noout dist/.well-known/bimi/logo.svg
      - name: Validate MTA-STS policy syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: STSv1$' .well-known/mta-sts.txt
          grep -q '^mode: testing$' .well-known/mta-sts.txt
          test "$(grep -c '^mx: ' .well-known/mta-sts.txt)" -eq 2
          grep -q '^version: STSv1$' dist/.well-known/mta-sts.txt
          grep -q '^mode: testing$' dist/.well-known/mta-sts.txt
          test "$(grep -c '^mx: ' dist/.well-known/mta-sts.txt)" -eq 2
