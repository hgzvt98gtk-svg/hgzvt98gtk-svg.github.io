name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install xmllint when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libxml2-utils || {
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libxml2-utils
            }
          fi
      - name: Install Node dependencies
        shell: bash
        run: npm ci --prefer-offline --no-audit
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files, XML/SVG, and module dependencies in parallel
        shell: bash
        run: |
          set -euo pipefail

          log_dir="$(mktemp -d)"

          (
            set -euo pipefail
            npm run validate:site
          ) >"${log_dir}/site.log" 2>&1 &
          site_pid=$!

          (
            set -euo pipefail
            npm run validate:xml
          ) >"${log_dir}/xml.log" 2>&1 &
          xml_pid=$!

          (
            set -euo pipefail
            npm run validate:deps
          ) >"${log_dir}/deps.log" 2>&1 &
          deps_pid=$!

          failures=0
          failed_jobs=()

          if ! wait "$site_pid"; then
            failures=$((failures + 1))
            failed_jobs+=("site")
          fi
          if ! wait "$xml_pid"; then
            failures=$((failures + 1))
            failed_jobs+=("xml")
          fi
          if ! wait "$deps_pid"; then
            failures=$((failures + 1))
            failed_jobs+=("deps")
          fi

          cmp Background.jpeg dist/Background.jpeg || {
            failures=$((failures + 1))
            failed_jobs+=("cmp")
          }

          for job in "${failed_jobs[@]}"; do
            if [ "$job" = "cmp" ]; then
              echo "::error::Background.jpeg and dist/Background.jpeg differ."
              continue
            fi
            echo "::group::Failed validation output (${job})"
            cat "${log_dir}/${job}.log"
            echo "::endgroup::"
          done

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
