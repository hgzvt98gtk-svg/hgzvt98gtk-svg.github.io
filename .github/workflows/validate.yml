name: Static site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        shell: bash
        run: npm ci --prefer-offline --no-audit
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          npm run build
      - name: Validate local files, XML/SVG, and module dependencies in parallel
        shell: bash
        run: |
          set -euo pipefail

          log_dir="$(mktemp -d)"
          declare -A pids
          declare -A commands=(
            [site]="npm run validate:site"
            [xml]="npm run validate:xml"
            [deps]="npm run validate:deps"
          )
          validation_jobs=(site xml deps)

          for job in "${validation_jobs[@]}"; do
            (
              set +e
              ${commands[$job]} >"${log_dir}/${job}.log" 2>&1
            ) &
            pids[$job]="$!"
          done

          failures=0
          failed_jobs=()

          for job in "${validation_jobs[@]}"; do
            if ! wait "${pids[$job]}"; then
              failures=$((failures + 1))
              failed_jobs+=("$job")
            fi
          done

          cmp Background.jpeg dist/Background.jpeg || {
            failures=$((failures + 1))
            failed_jobs+=("cmp")
          }

          for job in "${failed_jobs[@]}"; do
            if [ "$job" = "cmp" ]; then
              echo "::error::Background.jpeg and dist/Background.jpeg differ."
              continue
            fi
            echo "::group::Failed validation output (${job})"
            cat "${log_dir}/${job}.log"
            echo "::endgroup::"
          done

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
